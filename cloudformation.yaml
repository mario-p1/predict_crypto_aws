AWSTemplateFormatVersion: 2010-09-09

Parameters:
  CodeBucket:
    Type: String
    Description: S3 bucket name where the code is stored

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-data-bucket-${AWS::AccountId}

  FetchDataFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteDataBucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/*

  FetchDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: fetch_data_function.zip
      Role: !GetAtt FetchDataFunctionRole.Arn
      Handler: fetch_data_function.lambda_handler
      Runtime: python3.14
      Timeout: 600
      MemorySize: 512
      Environment:
        Variables:
          DATA_BUCKET: !Ref DataBucket